<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oscolderst</title>
<style>
  :root{
    --bg-top:#8b2fd6;
    --bg-bottom:#5b1aa8;
    --nav-bg:#0d0817;
    --card-bg:rgba(30,12,55,0.55);
    --card-border:rgba(255,255,255,0.08);
    --box-bg:rgba(255,255,255,0.06);
    --accent:#ff9d3d;
    --muted:#c9b8e8;
    --grad-btn-start:#7b5cff;
    --grad-btn-end:#5a3df0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.05) 0, transparent 40%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height:100vh;
  }
  /* subtle repeating net pattern overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 40px),
      repeating-linear-gradient(-45deg, #fff 0 1px, transparent 1px 40px);
    z-index:0;
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--nav-bg);
    padding:14px 32px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .profile{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar{
    position:relative;
    width:44px;height:44px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff5fa2,#7b5cff);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;
    border:2px solid #a855f7;
  }
  .avatar .live-dot{
    position:absolute;
    bottom:-2px;right:-2px;
    width:12px;height:12px;
    background:#ff3b3b;
    border-radius:50%;
    border:2px solid var(--nav-bg);
  }
  .profile-text .name{
    font-weight:700;
    font-size:16px;
  }
  .profile-text .sub{
    font-size:12px;
    color:#b48bff;
  }
  nav.center-nav{
    display:flex;
    gap:36px;
  }
  nav.center-nav a{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    opacity:0.95;
  }
  nav.center-nav a svg{width:18px;height:18px;}
  .socials{
    display:flex;
    gap:14px;
  }
  .socials a{
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    text-decoration:none;
  }
  .socials a svg{width:16px;height:16px;fill:#fff;}

  main{
    position:relative;
    z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:60px 24px 40px;
    text-align:center;
  }
  .eyebrow{color:var(--muted);font-size:15px;margin-bottom:6px;}
  h1{
    font-size:48px;
    margin:0 0 10px;
    font-weight:800;
  }
  .lede{color:var(--muted);font-size:16px;margin-bottom:48px;}

  .cards{
    display:grid;
    grid-template-columns:1fr;
    max-width:360px;
    margin:0 auto;
    gap:24px;
    text-align:left;
    align-items:start;
  }
  @media (max-width:900px){
    nav.center-nav{display:none;}
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:0 0 24px;
    position:relative;
    backdrop-filter:blur(6px);
    overflow:hidden;
  }
  .card-banner{
    width:100%;
    display:block;
    height:auto;
  }
  .tier-list{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin:16px 0;
  }
  .tier-list p{margin:0 0 8px;}
  .tier-list b{color:#fff;}
  @media (max-width:640px){
    .cards{grid-template-columns:1fr !important;max-width:360px !important;}
  }
  .card-body{
    padding:20px 24px 0;
  }
  .badge{
    position:absolute;
    top:18px;left:18px;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:0.5px;
  }
  .info-icon{
    position:absolute;
    top:16px;right:16px;
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:rgba(255,255,255,0.6);
  }
  .brand{
    text-align:center;
    font-size:22px;
    font-weight:800;
    margin:38px 0 22px;
    color:#e9e2ff;
    letter-spacing:0.5px;
  }
  .stat-row{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .stat-row.two{grid-template-columns:1fr 1fr;}
  .box{
    background:var(--box-bg);
    border-radius:10px;
    padding:14px 10px;
    text-align:center;
  }
  .box .big{
    font-size:20px;
    font-weight:800;
  }
  .box .big.code{color:var(--accent);}
  .box .small{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:2px;
  }
  .disclaimer{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin:14px 0 16px;
  }
  .cta{
    display:block;
    text-align:center;
    padding:14px;
    border-radius:10px;
    background:linear-gradient(90deg, var(--grad-btn-start), var(--grad-btn-end));
    color:#fff;
    font-weight:800;
    text-decoration:none;
    font-size:14px;
    letter-spacing:0.5px;
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:60px 24px 40px;
    color:var(--muted);
    font-size:13px;
  }
  footer .fine{
    margin-top:6px;
    font-size:12px;
    opacity:0.8;
  }
</style>
</head>
